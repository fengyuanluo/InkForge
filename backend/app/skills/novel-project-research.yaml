id: builtin-skill--novel-project-research
name: 新书立项与黄金三章研究
summary: 查询实时网文榜单，研究榜书简介和匿名公开黄金三章，并形成可溯源的对标报告与新书立项案。
is_enabled: true
content: |
  # 新书立项与黄金三章研究

  根据用户的实际目标自主决定研究深度。热门趋势、题材概览可以覆盖较多榜单和简介；只有需要精炼对标、诊断开篇或形成新书方案时，才逐本读取少量作品的匿名公开前三章。不要把流程变成固定问卷，不要写死样本数量，也不要要求用户重复确认已明确的信息。

  ## 工具选择

  1. 不知道当前有哪些榜单，或用户询问“某平台现在什么书比较火”时，调用 `discover_novel_rankings`。可用题材、频道、性别、榜单名或周期作为 `query`，必须采用返回的完整 `rank_id`。
  2. 调用 `list_ranked_novels` 查看所选榜单的排名、简介、分类、标签、状态和指标。仅做大盘研究时到此为止，不读取章节。
  3. 只有任务确实需要黄金三章证据时，才对有代表性的少量作品逐本调用 `read_novel_opening`。样本数量由问题复杂度和作品差异决定，不机械凑数。
  4. 工具失败时保留平台和阶段错误，说明缺失证据；不得把空结果、旧印象或模型常识冒充实时榜单事实。

  ## 分析方法

  - 先区分可核验事实、跨书共性、单书特征和基于样本的推断。
  - 简介重点分析：目标读者、题材信号、核心卖点、身份反差、冲突承诺、情绪承诺、悬念和差异化表达。
  - 黄金三章逐章分析：开场状态、主角目标与人设、核心冲突、信息释放、金手指或关键机制、情绪曲线、即时回报、章末钩子和下一章期待。
  - 比较“榜单上常见”与“值得本项目采用”，避免把相关性写成因果，也不要照搬具体作品的人物、设定、句式或情节。
  - 需要更深入的开篇结构、故事拆解或读者契约审查时，结合已启用的相关 Skill；不要在本 Skill 中重复整套方法论。

  ## 来源与留存

  - 每条事实保留平台、榜单名、采集时间和来源 URL。引用正文只选支撑判断所需的短句，不大段复制。
  - 榜单全集、简介全集和章节正文仅用于当前分析，不写入项目笔记，不导入语料库。
  - 只有少量精选对标书值得长期复盘时，才建议保存结构化书卡。每本书单独一篇，放在 `立项研究/对标书卡` 分类下，便于独立删除；写入仍须遵循现有笔记审批。
  - 书卡只保留元数据、来源、采集时间、结构化摘要、少量短引文和结论，不保存章节全文。

  ## 交付

  用户需要完整立项时，形成两份独立项目笔记：

  - `立项研究/对标研究`：研究问题、样本与来源、榜单观察、简介规律、黄金三章规律、差异点、反例、证据限制和可执行结论。
  - `立项研究/新书立项案`：目标平台与赛道、核心读者契约、一句话卖点、简介草案、主角与关键机制、核心冲突、黄金三章逐章目标、差异化策略和待验证风险。

  若用户只问热门趋势或单点问题，直接回答所需结论，不强制生成笔记或完整立项案。
references:
  - name: 对标书卡模板
    content: |
      # 对标书卡

      - 作品、作者、平台：
      - 榜单、排名、采集时间：
      - 作品页与榜单来源：
      - 分类、标签、连载状态、公开指标：
      - 简介卖点摘要：
      - 第一章：开场、冲突、人物、钩子：
      - 第二章：升级、信息、回报、钩子：
      - 第三章：承诺兑现、主线确立、追读期待：
      - 三章情绪与信息曲线：
      - 可借鉴的抽象方法：
      - 应避免的同质化元素：
      - 证据短引文：
      - 证据缺口与判断置信度：
  - name: 公开采集边界
    content: |
      - 仅使用起点、番茄、晋江、纵横无需登录即可访问的公开页面和免费章节。
      - 跳过登录、付费、锁定、App 专属和加密内容，不尝试获取支付密钥或绕过访问控制。
      - `discover_novel_rankings` 返回的是当前页面或接口实际发现的榜单组合，不自行生成题材组合。
      - 平台页面会变化；解析失败时记录 site 和 stage，并按协议适配器修复，不改用臆测结果。
