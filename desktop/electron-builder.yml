appId: com.openfic.app
productName: InkForge
copyright: Copyright (c) 2026 InkForge contributors

directories:
  output: dist-electron

publish:
  provider: github
  owner: fengyuanluo
  repo: InkForge
  releaseType: release

electronLanguages:
  - en-US
  - zh-CN

files:
  - dist/**/*
  - package.json

extraResources:
  - from: ../frontend/dist
    to: frontend-dist
    filter:
      - "**/*"
  - from: resources/app-update.yml
    to: app-update.yml

win:
  artifactName: InkForge-${version}-win-${arch}.${ext}
  target:
    - nsis
    - zip

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  artifactName: InkForge-${version}-win-${arch}-setup.${ext}

mac:
  artifactName: InkForge-${version}-mac-${arch}.${ext}
  target:
    - dmg
    - zip
  category: public.app-category.productivity
  identity: null

linux:
  artifactName: InkForge-${version}-linux-${arch}.${ext}
  synopsis: An AI-native writing tool for fiction authors
  description: InkForge is an AI-native, cross-platform writing tool built for fiction authors.
  vendor: fengyuanluo
  target:
    - AppImage
    - tar.gz
  category: Utility
